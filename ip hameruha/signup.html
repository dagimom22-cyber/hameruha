<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Hameruha Store</h1>
</header>

<section class="form-section">
  <h2>Create Account (Optional)</h2>
  <form id="signupForm">
    <input type="text" id="suName" placeholder="Username">
    <input type="email" id="suEmail" placeholder="Email">
    <input type="password" id="suPass" placeholder="Password">
    <button type="submit">Signup</button>
  </form>

  <p>Signup is optional.</p>
  <a href="index.html">Continue Shopping</a>
</section>

<footer>
  <p>&copy; 2026 Hameruha Store</p>
</footer>

<script src="script.js"></script>
</body>
</html>
